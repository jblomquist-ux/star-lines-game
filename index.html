<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Star Lines — Auto-Detect</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #070e1f; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  #wrap {
    position: relative; width: 100vw; height: 100vh; touch-action: none; user-select: none;
  }
  canvas { position: absolute; inset: 0; display: block; }

  /* HUD buttons (bottom-right) */
  .hud {
    position: absolute; right: 16px; bottom: 16px; display: flex; gap: 12px; z-index: 10;
  }
  .btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(15,20,35,0.6); display: grid; place-items: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35); cursor: pointer; outline: none; border: none;
    backdrop-filter: blur(2px);
  }
  .btn svg { width: 22px; height: 22px; opacity: 0.85; }
  .btn:focus-visible { box-shadow: 0 0 0 3px rgba(0,178,255,0.6), 0 4px 14px rgba(0,0,0,0.35); }
  .btn[aria-pressed="true"] svg { filter: drop-shadow(0 0 6px #00B2FF); opacity: 1; }
  .btn:hover svg { opacity: 1; }
  .tooltip {
    position: absolute; bottom: 64px; right: 0; padding: 6px 8px; border-radius: 8px; font-size: 12px;
    background: rgba(10,14,26,0.85); color: #fff; white-space: nowrap; pointer-events: none; opacity: 0; transform: translateY(6px);
    transition: opacity .15s ease, transform .15s ease;
  }
  .hud:hover .tooltip { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="wrap" aria-label="Star Lines Game">
  <canvas id="bg"></canvas>     <!-- background image -->
  <canvas id="fx"></canvas>     <!-- sparkles + shooting star -->
  <canvas id="game"></canvas>   <!-- lines, selection, hit tests -->

  <div class="hud" role="group" aria-label="Drawing controls">
    <button id="trashBtn" class="btn" type="button" title="Clear lines" aria-label="Clear lines">
      <!-- trash icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
    <button id="drawBtn" class="btn" type="button" title="Draw mode" aria-label="Draw mode" aria-pressed="false">
      <!-- pencil icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
      </svg>
    </button>
    <div class="tooltip" id="tip">Click dots to connect in Draw Mode</div>
  </div>
</div>

<script>
(() => {
  // ==== CONFIG ====
  const IMG_SRC = "Constellation%20Puzzle%20(2).png";
  const SHOOTING_STAR_INTERVAL_MS = 5000;
  const SPARKLE_COUNT_DESKTOP = 60, SPARKLE_COUNT_MOBILE = 32;
  const HIT_RADIUS_PX = 18;  // base (will be scaled for touch)
  const LINE_COLOR = "#00B2FF";
  const YELLOW_FILTER = { // coarse color threshold to isolate labeled star dots
    rMin: 230, gMin: 220, bMax: 200, rbGap: 30, gbGap: 20
  };
  // Labeled dots are big; filter blobs by radius (original image scale)
  const BLOB_RADIUS_RANGE = { min: 8, max: 22 }; // px at original scale

  // ==== CANVASES ====
  const wrap = document.getElementById('wrap');
  const cBG = document.getElementById('bg');
  const cFX = document.getElementById('fx');
  const cGame = document.getElementById('game');
  const ctxBG = cBG.getContext('2d');
  const ctxFX = cFX.getContext('2d');
  const ctx = cGame.getContext('2d');

  const drawBtn = document.getElementById('drawBtn');
  const trashBtn = document.getElementById('trashBtn');

  const DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  let W=0, H=0;

  // ==== STATE ====
  const state = {
    img: new Image(),
    imgW: 0, imgH: 0,
    // how the image fits the viewport
    view: { x:0,y:0,w:0,h:0, scaleX:1, scaleY:1 },
    drawMode: false,
    dots: [],              // {xNorm,yNorm}
    selected: null,        // index into dots
    lines: [],             // [{a,b}] with a<b normalized indices
    sparkles: [],
    shootingStar: null,    // {t,start,ctrl,end,dur}
    lastShoot: 0,
    lastTime: 0,
    hitRadius: HIT_RADIUS_PX,
  };

  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch) state.hitRadius = 22;

  // ==== IMAGE LOAD ====
  state.img.onload = async () => {
    state.imgW = state.img.naturalWidth;
    state.imgH = state.img.naturalHeight;
    resize();
    ctxBG.drawImage(state.img, state.view.x, state.view.y, state.view.w, state.view.h);

    // Auto-detect labeled star dots
    state.dots = await detectDotsFromImage(state.img, BLOB_RADIUS_RANGE, YELLOW_FILTER);
    // Project to normalized coords
    // detectDotsFromImage returns in image pixel coords (original scale)
    state.dots = state.dots.map(p => ({ xNorm: p.x / state.imgW, yNorm: p.y / state.imgH }));
    // Prepare sparkles (use subset of dots; add a few random background twinkles)
    const sparkleTarget = (isTouch ? SPARKLE_COUNT_MOBILE : SPARKLE_COUNT_DESKTOP);
    const pool = state.dots.slice();
    shuffle(pool);
    const picks = pool.slice(0, Math.min(sparkleTarget, pool.length));
    state.sparkles = picks.map(p => ({
      x: p.xNorm, y: p.yNorm,
      phase: Math.random() * Math.PI*2,
      speed: 1 + Math.random()*1.5
    }));
    while (state.sparkles.length < sparkleTarget) {
      state.sparkles.push({
        x: Math.random(), y: Math.random(),
        phase: Math.random() * Math.PI*2,
        speed: 1 + Math.random()*1.5
      });
    }

    // Start loop
    state.lastTime = performance.now();
    requestAnimationFrame(loop);
  };
  state.img.src = IMG_SRC;

  // ==== RESIZE / DPR ====
  function resize() {
    const rectW = wrap.clientWidth, rectH = wrap.clientHeight;
    W = Math.floor(rectW * DPR); H = Math.floor(rectH * DPR);

    for (const c of [cBG, cFX, cGame]) {
      c.width = W; c.height = H;
      c.style.width = rectW + "px"; c.style.height = rectH + "px";
    }
    // compute cover fit
    const iw = state.imgW || 1, ih = state.imgH || 1;
    const s = Math.max(W/iw, H/ih);
    const w = iw*s, h = ih*s;
    const x = (W - w)/2, y = (H - h)/2;
    state.view = { x, y, w, h, scaleX: s, scaleY: s };

    // redraw background
    if (state.imgW) {
      ctxBG.clearRect(0,0,W,H);
      ctxBG.drawImage(state.img, x, y, w, h);
    }
  }
  window.addEventListener('resize', () => { resize(); });

  // ==== AUTO-DETECTION (connected components on downscaled image) ====
  async function detectDotsFromImage(img, radiusRange, colorFilter) {
    // Downscale for speed
    const scale = 0.5; // 50%
    const ow = img.naturalWidth, oh = img.naturalHeight;
    const dw = Math.floor(ow * scale), dh = Math.floor(oh * scale);

    const off1 = document.createElement('canvas');
    off1.width = dw; off1.height = dh;
    const octx = off1.getContext('2d', { willReadFrequently: true });
    octx.drawImage(img, 0, 0, dw, dh);
    const { data } = octx.getImageData(0, 0, dw, dh);

    // Threshold mask
    const mask = new Uint8Array(dw * dh);
    for (let y=0; y<dh; y++) {
      for (let x=0; x<dw; x++) {
        const i = (y*dw + x)*4;
        const r = data[i], g = data[i+1], b = data[i+2];
        const pass = (r >= colorFilter.rMin) &&
                     (g >= colorFilter.gMin) &&
                     (b <= colorFilter.bMax) &&
                     ((r + g)/2 - b >= colorFilter.rbGap) &&
                     (g - b >= colorFilter.gbGap);
        mask[y*dw + x] = pass ? 1 : 0;
      }
    }

    // Connected components (4-neighbor)
    const visited = new Uint8Array(dw*dh);
    const blobs = [];
    const qx = new Int32Array(dw*dh);
    const qy = new Int32Array(dw*dh);

    for (let y=0; y<dh; y++) {
      for (let x=0; x<dw; x++) {
        const idx = y*dw + x;
        if (!mask[idx] || visited[idx]) continue;
        let head=0, tail=0, count=0, sumX=0, sumY=0, minX=x, minY=y, maxX=x, maxY=y;
        visited[idx]=1; qx[tail]=x; qy[tail]=y; tail++;
        while (head<tail) {
          const cx=qx[head], cy=qy[head]; head++; count++;
          sumX += cx; sumY += cy;
          if (cx<minX) minX=cx; if (cy<minY) minY=cy;
          if (cx>maxX) maxX=cx; if (cy>maxY) maxY=cy;
          // neighbors
          const nbs = [[1,0],[-1,0],[0,1],[0,-1]];
          for (const [dx,dy] of nbs) {
            const nx=cx+dx, ny=cy+dy;
            if (nx<0||ny<0||nx>=dw||ny>=dh) continue;
            const nidx = ny*dw + nx;
            if (mask[nidx] && !visited[nidx]) {
              visited[nidx]=1; qx[tail]=nx; qy[tail]=ny; tail++;
            }
          }
        }
        // Bounding box -> approximate radius
        const bbW = (maxX - minX + 1) / scale; // back to original px
        const bbH = (maxY - minY + 1) / scale;
        const approxR = Math.max(bbW, bbH) / 2;
        if (approxR >= radiusRange.min && approxR <= radiusRange.max) {
          const cx = (sumX / count) / scale;
          const cy = (sumY / count) / scale;
          blobs.push({ x: cx, y: cy, r: approxR });
        }
      }
    }

    // De-duplicate (merge close centers)
    const merged = [];
    const dist2 = (a,b) => (a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y);
    const mergeThreshold = 14; // px at original scale
    for (const b of blobs) {
      let placed=false;
      for (const m of merged) {
        if (dist2(b,m) <= mergeThreshold*mergeThreshold) {
          // average
          m.x = (m.x + b.x)/2; m.y = (m.y + b.y)/2; m.r = Math.max(m.r, b.r);
          placed=true; break;
        }
      }
      if (!placed) merged.push({...b});
    }

    // Sort left-to-right, top-to-bottom (optional; purely for stable indices)
    merged.sort((p,q) => p.y===q.y ? p.x-q.x : p.y-q.y);

    // Limit to a sensible maximum (there are ~40–60 labeled dots on your image)
    return merged.slice(0, 100);
  }

  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=(Math.random()*(i+1)|0); [arr[i],arr[j]]=[arr[j],arr[i]]} }

  // ==== INPUT / HIT TESTS ====
  function screenFromNorm(p){
    return {
      x: state.view.x + p.xNorm * state.view.w,
      y: state.view.y + p.yNorm * state.view.h
    };
  }
  function hitDot(px, py) {
    const r = state.hitRadius * DPR;
    const r2 = r*r;
    for (let i=0;i<state.dots.length;i++){
      const p = screenFromNorm(state.dots[i]);
      const dx = px - p.x, dy = py - p.y;
      if (dx*dx + dy*dy <= r2) return i;
    }
    return -1;
  }

  function onPointerDown(e){
    const rect = cGame.getBoundingClientRect();
    const px = (e.clientX - rect.left) * DPR;
    const py = (e.clientY - rect.top) * DPR;

    if (!state.drawMode) return;

    const idx = hitDot(px, py);
    if (idx >= 0){
      if (state.selected === null) {
        state.selected = idx;
        // selection ring fades automatically in render
        selectionPulse = 1; // reset pulse
      } else if (state.selected !== idx) {
        const a = Math.min(state.selected, idx);
        const b = Math.max(state.selected, idx);
        const key = a + ":" + b;
        if (!lineSet.has(key)) {
          state.lines.push({a,b});
          lineSet.add(key);
          // (optional) play a very soft plink here if you add audio
        }
        state.selected = idx; // keep selected for chaining
        selectionPulse = 1;
      }
    } else {
      // click outside cancels selection
      state.selected = null;
    }
  }
  cGame.addEventListener(isTouch ? 'pointerdown' : 'mousedown', onPointerDown);

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') toggleDrawMode();
    else if (e.key === 'Escape') state.selected = null;
    else if (e.key === 'Delete' || e.key === 'Backspace') clearLines();
  });

  // HUD buttons
  function toggleDrawMode(){
    state.drawMode = !state.drawMode;
    drawBtn.setAttribute('aria-pressed', state.drawMode ? 'true' : 'false');
  }
  function clearLines(){
    state.lines.length = 0; lineSet.clear();
    state.selected = null;
  }
  drawBtn.addEventListener('click', toggleDrawMode);
  trashBtn.addEventListener('click', clearLines);

  // For quick duplicate checks
  const lineSet = new Set();

  // ==== RENDER LOOP ====
  let selectionPulse = 0; // 0..1 for ring animation

  function loop(t){
    const dt = Math.min(32, t - state.lastTime); // ms cap
    state.lastTime = t;

    // FX layer: sparkles + shooting star
    renderFX(t, dt);

    // Game layer: lines + selection
    renderGame(t, dt);

    requestAnimationFrame(loop);
  }

  function renderFX(t, dt){
    const {x,y,w,h} = state.view;
    ctxFX.clearRect(0,0,W,H);

    // Sparkles (subtle)
    for (const s of state.sparkles){
      s.phase += 0.0025 * dt * s.speed;
      const a = 0.6 + 0.4 * (0.5 + 0.5*Math.sin(s.phase));
      const px = x + s.x * w, py = y + s.y * h;
      ctxFX.beginPath();
      ctxFX.globalAlpha = a * 0.55; // subtle
      ctxFX.fillStyle = '#FFF3C4';
      ctxFX.arc(px, py, 2.2*DPR, 0, Math.PI*2);
      ctxFX.shadowColor = '#FFF3C4';
      ctxFX.shadowBlur = 4;
      ctxFX.fill();
      ctxFX.shadowBlur = 0; ctxFX.globalAlpha = 1;
    }

    // Shooting star every ~5s
    if (!state.shootingStar && (t - state.lastShoot) > SHOOTING_STAR_INTERVAL_MS){
      state.lastShoot = t;
      state.shootingStar = createShootingStar();
    }
    if (state.shootingStar){
      const s = state.shootingStar;
      s.t += dt / s.dur;
      const tt = easeOutQuad(Math.min(1, s.t));
      const p = quadBezier(s.start, s.ctrl, s.end, tt);

      // trail
      const trail = 90 * DPR;
      const tail = quadBezier(s.start, s.ctrl, s.end, Math.max(0, tt - 0.12));
      const dx = p.x - tail.x, dy = p.y - tail.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx/len, uy = dy/len;
      const tailEnd = { x: p.x - ux*trail, y: p.y - uy*trail };

      const grd = ctxFX.createLinearGradient(p.x, p.y, tailEnd.x, tailEnd.y);
      grd.addColorStop(0, 'rgba(255,255,255,0.85)');
      grd.addColorStop(1, 'rgba(255,255,255,0.0)');
      ctxFX.strokeStyle = grd;
      ctxFX.lineWidth = 2*DPR;
      ctxFX.beginPath();
      ctxFX.moveTo(tailEnd.x, tailEnd.y);
      ctxFX.lineTo(p.x, p.y);
      ctxFX.stroke();

      ctxFX.fillStyle = 'rgba(255,255,255,0.9)';
      ctxFX.beginPath();
      ctxFX.arc(p.x, p.y, 1.8*DPR, 0, Math.PI*2);
      ctxFX.fill();

      if (s.t >= 1) state.shootingStar = null;
    }
  }

  function renderGame(t, dt){
    ctx.clearRect(0,0,W,H);

    // Draw all user lines
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3 * DPR;
    ctx.strokeStyle = LINE_COLOR;
    ctx.shadowColor = LINE_COLOR;
    ctx.shadowBlur  = 6;

    ctx.beginPath();
    for (const L of state.lines){
      const a = screenFromNorm(state.dots[L.a]);
      const b = screenFromNorm(state.dots[L.b]);
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Selection ring
    if (state.selected !== null) {
      const p = screenFromNorm(state.dots[state.selected]);
      selectionPulse = Math.max(0, selectionPulse - dt/600);
      const ringR = (state.hitRadius + 6*selectionPulse) * DPR;
      ctx.beginPath();
      ctx.strokeStyle = LINE_COLOR;
      ctx.lineWidth = 2 * DPR;
      ctx.globalAlpha = 0.9 - 0.5*selectionPulse;
      ctx.arc(p.x, p.y, ringR, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ==== UTILITIES ====
  function quadBezier(p0, p1, p2, t){
    const u = 1 - t;
    return {
      x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
      y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y
    };
  }
  function easeOutQuad(x){ return 1 - (1-x)*(1-x); }

  function createShootingStar(){
    // Start and end slightly outside the view rect; arc across middle third
    const {x,y,w,h} = state.view;
    const edges = [
      {x: x-40*DPR, y: y + Math.random()*h},                   // left
      {x: x+w+40*DPR, y: y + Math.random()*h},                 // right
      {x: x + Math.random()*w, y: y-40*DPR},                   // top
      {x: x + Math.random()*w, y: y+h+40*DPR},                 // bottom
    ];
    const start = edges[(Math.random()*edges.length)|0];
    let end;
    do { end = edges[(Math.random()*edges.length)|0]; }
    while (end === start);
    const cx = x + w*0.5 + (Math.random()-0.5)*w*0.2;
    const cy = y + h*0.45 + (Math.random()-0.5)*h*0.2;
    const ctrl = { x: cx, y: cy };
    return { t: 0, start, ctrl, end, dur: 900 + Math.random()*250 };
  }

})();
</script>
</body>
</html>
